services:
  # 1. Apache Kafka Official Image (KRaft mode: zero ZooKeeper, ultra-fast RAM log streaming)
  kafka:
    image: apache/kafka:latest
    container_name: kafka_broker
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.0.21:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 2. EMQX Broker (Mapped to host port 18883 to avoid conflict with existing MQTT broker on 1883)
  emqx:
    image: emqx/emqx:5.8.0
    container_name: emqx_broker
    restart: always
    ports:
      - "18883:1883"      # MQTT TCP (Host port 18883)
      - "8083:8083"       # MQTT WebSocket
      - "18083:18083"     # EMQX Web Dashboard
    environment:
      - "EMQX_DASHBOARD__DEFAULT_USERNAME=admin"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=public"
